name: Deploy GitHub Pages

# The site is the repository root: index.html is a single hand written page
# that loads its examples by relative path, so there is nothing to build.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish before the next starts, so overlapping pushes cannot
# race each other to publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The gate in front of the deploy. The page fetches cheatsheets.json and
  # builds both dropdowns from it, so a broken catalog is a broken page rather
  # than a stale one, and the failures worth catching are the ones that pass
  # locally: Pages serves from a case sensitive filesystem while the work
  # happens on Windows, so a casing mismatch resolves on the machine that made
  # it and 404s only here.
  #
  # It runs on the repository as committed, with no install step. There is no
  # package.json and no dependency by design, which is the same constraint that
  # keeps php -S localhost:8000 the whole local workflow. The Node version is
  # pinned rather than taken from the runner because this job composes every
  # sheet through the vendored drawing surface, and that package declares Node
  # 22.12 or later - a runner that moved under it would fail the deploy with a
  # syntax error rather than a finding.
  #
  # The vendored copy is checked beside the catalog, offline: every file in
  # api/napkin-sketch/ is hashed against the record in its VENDOR.json, so a
  # byte edited there - and nothing there is ever edited - fails here rather
  # than shipping. The checker is the package's own, written into the folder
  # beside the copy by napkin-sketch vendor, so it is plain node with no
  # install and nothing of this repository's behind it.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use the Node the vendored package declares
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the vendored drawing surface against its record
        run: node api/napkin-sketch/VENDOR-CHECK.mjs

      - name: Check the cheatsheet tree and the committed manifest
        run: node tools/build-manifest.mjs --check

  # The site is the repository root with one exception, and the exception is
  # spelled out rather than assumed: see "What the site does not carry" in
  # CONTRIBUTING.md, which is where a contributor meets it.
  build:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Decided on 2026.10.26. The eleven JPEGs in javaScriptArrays/ are
      # 20,302,335 bytes of the 22,944,433 the repository tracks - 88.5% of the
      # artifact - and nothing on the published site asks for any of them:
      # index.html references none, cheatsheets.json records none, the catalog
      # walk never reaches that folder because it holds no sheet.json, and no
      # sheet.json names one. They are evidence rather than content, per
      # javaScriptArrays/README.md: the global design language was measured off
      # these bytes and tools/test-sheet-composition.mjs re-measures them. That
      # reading happens in a clone, never over HTTP, so excluding them from the
      # artifact costs the suite nothing and costs a reader nothing.
      #
      # Removed from the runner's own checkout, which is thrown away after the
      # job. Nothing in the repository is touched, and the files stay tracked
      # and committed - this is the one place the site and the repository
      # differ, and it is deliberate rather than a drop.
      #
      # The README beside them is kept. It is 5 KB, it explains what the folder
      # is, and leaving it means the path still answers rather than 404ing for
      # anyone who follows a link to it.
      - name: Leave the reference images out of the artifact
        run: |
          du -cb javaScriptArrays/*.jpg | tail -1
          rm javaScriptArrays/*.jpg
          test ! -e javaScriptArrays/SplicingArrays.jpg
          test -e javaScriptArrays/README.md

      - name: Configure the Pages environment
        uses: actions/configure-pages@v5

      - name: Upload the repository root as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
