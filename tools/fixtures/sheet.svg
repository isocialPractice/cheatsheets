  <text data-name="title" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="196.106" font-weight="400" xml:space="preserve" fill="#414143"><tspan x="759.267" y="730">Splicing Array Elements</tspan></text>
  <text data-name="subtitle" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="155.772" font-weight="400" xml:space="preserve" fill="#414143"><tspan x="1380.195" y="923">Splice Array</tspan></text>
  <text data-name="lead-in" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="155.772" font-weight="400" xml:space="preserve" fill="#414143"><tspan x="384" y="1133">Starting Point for Practical Use:</tspan></text>
  <text data-name="code-0" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#FFFFFF"><tspan x="480" y="1310">var fruits = [&apos;Banana&apos;, &apos;Orange&apos;, &apos;Apple&apos;, &apos;Mango&apos;];</tspan></text>
  <text data-name="code-1" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#FFFFFF"><tspan x="480" y="1411.493">console.log(fruits.splice(2, 2, &apos;Lemon&apos;, &apos;Kiwi&apos;));</tspan></text>
  <text data-name="code-2" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#B4BEC8"><tspan x="480" y="1512.985">// (2) [&apos;Apple&apos;, &apos;Mango&apos;]</tspan></text>
  <text data-name="code-4" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#FFFFFF"><tspan x="480" y="1715.97">var trees = [&apos;Maple&apos;, &apos;Spruce&apos;, &apos;Palm&apos;];</tspan></text>
  <text data-name="code-5" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#FFFFFF"><tspan x="480" y="1817.463">trees.splice(3, 0, &apos;Birch&apos;);</tspan></text>
  <text data-name="code-6" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#B4BEC8"><tspan x="480" y="1918.956">// (4) [&apos;Maple&apos;, &apos;Spruce&apos;, &apos;Palm&apos;, &apos;Birch&apos;]</tspan></text>
  <text data-name="code-8" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#FFFFFF"><tspan x="480" y="2121.941">var mapleTrees = [&apos;Silver&apos;, &apos;Norway&apos;, &apos;Bigleaf&apos;];</tspan></text>
  <text data-name="code-9" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#FFFFFF"><tspan x="480" y="2223.434">console.log(mapleTrees.length);</tspan></text>
  <text data-name="code-10" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#B4BEC8"><tspan x="480" y="2324.926">// 3</tspan></text>
  <text data-name="code-12" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#FFFFFF"><tspan x="480" y="2527.911">var sliced = fruits.slice(1, 3);</tspan></text>
  <text data-name="code-13" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#FFFFFF"><tspan x="480" y="2629.404">console.log(sliced.join(&apos; and &apos;));</tspan></text>
  <text data-name="code-14" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#B4BEC8"><tspan x="480" y="2730.897">// Orange and Apple</tspan></text>
  <text data-name="code-16" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#FFFFFF"><tspan x="480" y="2933.882">var joined = fruits.concat(trees, mapleTrees);</tspan></text>
  <text data-name="code-17" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#FFFFFF"><tspan x="480" y="3035.375">console.log(joined.indexOf(&apos;Birch&apos;));</tspan></text>
  <text data-name="code-18" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="86.231" xml:space="preserve" fill="#B4BEC8"><tspan x="480" y="3136.867">// 6</tspan></text>
  <rect data-name="mark-square" x="0" y="3264" width="288" height="336" fill="#000132"/>
  <text data-name="follow-line" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="208.623" font-weight="400" xml:space="preserve" fill="#000132"><tspan x="576" y="3479">Follow along at practicing.xyz</tspan></text>
