  <text data-name="wordmark" font-family="&quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif" font-size="305.981" font-weight="300" xml:space="preserve" fill="#FFFFFF"><tspan x="873.338" y="353">practicing.xyz</tspan></text>
  <rect data-name="rule-upper-left" x="0" y="532" width="432" height="45" fill="#4DAE51"/>
  <rect data-name="rule-upper-right" x="3168" y="532" width="432" height="45" fill="#4DAE51"/>
  <rect data-name="rule-lower-left" x="0" y="623" width="432" height="20" fill="#4DAE51"/>
